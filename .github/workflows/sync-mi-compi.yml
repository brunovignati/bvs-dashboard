name: BVS Analytics — Sync Mi Compi Registrations

# NOTA: la API key de Connectif NO puede crear exports (POST /exports → 403),
# por lo que este workflow no puede correr en automático. La captura SEMANAL
# de Mi Compi se hace vía Cowork scheduled task "bvs-mi-compi-sync" (como el
# sync social). Este workflow queda solo como fallback manual por si Connectif
# habilita el permiso de exports en la API key.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      export_id:
        description: Export ID ya creado en Connectif (opcional)
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Sincronizar Mi Compi → Supabase
        env:
          CONNECTIF_API_KEY: ${{ secrets.CONNECTIF_API_KEY }}
          CONNECTIF_EXPORT_ID: ${{ inputs.export_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_mi_compi.py
