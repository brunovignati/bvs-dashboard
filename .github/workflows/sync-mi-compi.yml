name: BVS Analytics â Sync Mi Compi Registrations

on:
  schedule:
    - cron: '0 */6 * * *'   # Cada 6h (00, 06, 12, 18 UTC)
  workflow_dispatch:          # Ejecutable a mano desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Sincronizar Mi Compi â Supabase
        env:
          CONNECTIF_API_KEY: ${{ secrets.CONNECTIF_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_mi_compi.py
